<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Mother Theresa Degree College</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .auth-form .card-header h2 {
            color: #fff;
        }

        .btn-check {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .btn-check:checked + .btn-outline {
            background: var(--app-primary);
            border-color: var(--app-primary);
            color: #fff;
        }

        .btn-check:focus-visible + .btn-outline {
            outline: 2px solid var(--app-primary-light);
            outline-offset: 2px;
        }

        .form-error {
            margin-bottom: 20px;
            padding: 12px 16px;
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 10px;
            background: rgba(220, 38, 38, 0.08);
            color: #b91c1c;
            font-size: 14px;
        }

        .form-error[hidden],
        .upload-progress[hidden] {
            display: none;
        }

        .auth-card {
            max-width: 420px;
            margin: 80px auto;
            padding: 40px 32px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        @media (max-width: 480px) {
            .auth-card {
                margin: 60px 20px;
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

<!-- ================= TOP BAR ================= -->
<div class="top-bar">
    <div>
        <span><i class="fa-solid fa-phone"></i> 08579-268585</span>
        <span><i class="fa-solid fa-envelope"></i> mtidegree@gmail.com</span>
    </div>
    <div>
        <span><i class="fa-solid fa-graduation-cap"></i> Previous Year Question Papers Portal</span>
    </div>
</div>

<!-- ================= AUTH CARD ================= -->
<div class="auth-card">
    <div class="card">
        <div class="card-header bg-white py-3">
            <h2 class="h5 fw-bold mb-0 text-center"><i class="bi bi-key"></i> Reset Your Password</h2>
        </div>
        <div class="card-body p-4">
            <p class="text-muted text-center mb-4">Enter your email address and we'll send you a link to reset your password.</p>

            <form id="forgotPasswordForm" method="post" onsubmit="event.preventDefault()">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="email">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-accent btn-lg">
                        <i class="bi bi-send me-2"></i> Send Reset Link
                    </button>
                </div>

                <div class="text-center mt-3">
                    <p class="text-muted small">Don't have an account? <a href="register.html">Create one</a></p>
                    <p class="text-muted small"><a href="login.html">Back to login</a></p>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ================= JAVASCRIPT ================= -->
<script type="module">
    import { auth } from './firebase-config.js';
    import {
        sendPasswordResetEmail
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();

        if (!email) {
            alert('Please enter your email address.');
            return;
        }

        const btn = this.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Sending...';
        btn.disabled = true;

        try {
            await sendPasswordResetEmail(auth, email);
            showToast('Password reset link sent to ' + email + '. Please check your email.', 'success');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 3000);
        } catch (err) {
            console.error('Password reset error:', err);
            let msg;
            switch (err.code) {
                case 'auth/user-not-found':
                    msg = 'No account found with this email address.';
                    break;
                case 'auth/invalid-email':
                    msg = 'Invalid email address format.';
                    break;
                case 'auth/network-request-failed':
                    msg = 'Network error. Please check your connection and try again.';
                    break;
                default:
                    msg = 'Failed to send reset link. ' + (err && err.message ? err.message : 'Unknown error');
            }
            alert(msg);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });

    function showToast(message, type = 'success') {
        // Simple inline toast - in production use the full toast system
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.style.position = 'fixed';
        toast.style.top = '20px';
        style = 'right: 20px;';
        toast.style.zIndex = '9999';
        toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check'} me-2"></i>${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.style.opacity = '0', 3000);
        setTimeout(() => toast.remove(), 3500);
    }
</script>

</body>
</html>
