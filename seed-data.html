<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed Firestore Data - QP Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        body { padding: 2rem; max-width: 800px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; margin: 0.5rem; }
        .btn-primary { background: #062b63; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .log { background: #f8f9fa; border-radius: 8px; padding: 1rem; font-family: monospace; font-size: 0.85rem; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .info { color: #062b63; }
    </style>
</head>
<body>
    <div class="card">
        <h2><i class="bi bi-database"></i> Seed Firestore Data</h2>
        <p class="text-muted">Run this ONCE to populate courses, subcourses, subjects, and academic years. Delete this file after use.</p>
        <button class="btn btn-primary" id="seedBtn" onclick="seedData()"><i class="bi bi-play-fill"></i> Seed Data</button>
        <button class="btn btn-danger" id="clearBtn" onclick="clearData()"><i class="bi bi-trash"></i> Clear All Data</button>
        <button class="btn btn-success" id="verifyBtn" onclick="verifyData()"><i class="bi bi-check-circle"></i> Verify Data</button>
    </div>

    <div class="card">
        <h5>Console Log</h5>
        <div id="log" class="log">Ready. Click "Seed Data" to populate Firestore...</div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc, writeBatch, doc, getDocs, query, orderBy, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        const logEl = document.getElementById('log');
        function log(msg, type = 'info') {
            const prefix = new Date().toLocaleTimeString();
            logEl.textContent += `\n[${prefix}] ${msg}`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function seedData() {
            log('Starting seed...', 'info');
            document.getElementById('seedBtn').disabled = true;

            try {
                const batch = writeBatch(db);

                // 1. Courses
                const courses = [
                    { code: 'BCOM', name: 'B.Com' },
                    { code: 'BSC', name: 'B.Sc' },
                    { code: 'BCA', name: 'BCA' },
                    { code: 'BBA', name: 'BBA' }
                ];
                const courseRefs = {};
                for (const c of courses) {
                    const ref = doc(collection(db, 'courses'));
                    batch.set(ref, c);
                    courseRefs[c.code] = ref.id;
                    log(`Course: ${c.code} - ${c.name} (ID: ${ref.id})`);
                }

                // 2. Subcourses
                const subcourses = [
                    { courseId: courseRefs.BCOM, name: 'General' },
                    { courseId: courseRefs.BSC, name: 'Computer Science' },
                    { courseId: courseRefs.BSC, name: 'Data Science' },
                    { courseId: courseRefs.BCA, name: 'General' },
                    { courseId: courseRefs.BBA, name: 'General' }
                ];
                const subRefs = {};
                for (const s of subcourses) {
                    const ref = doc(collection(db, 'subcourses'));
                    batch.set(ref, s);
                    subRefs[`${s.courseId}_${s.name}`] = ref.id;
                    log(`Subcourse: ${s.name} (Course: ${s.courseId}) (ID: ${ref.id})`);
                }

                // 3. Subjects
                const subjects = [
                    // B.Com General
                    { subcourseId: subRefs[`${courseRefs.BCOM}_General`], code: 'CO101', name: 'Financial Accounting' },
                    { subcourseId: subRefs[`${courseRefs.BCOM}_General`], code: 'CO102', name: 'Business Laws' },
                    { subcourseId: subRefs[`${courseRefs.BCOM}_General`], code: 'CO201', name: 'Corporate Accounting' },
                    { subcourseId: subRefs[`${courseRefs.BCOM}_General`], code: 'CO301', name: 'Cost Accounting' },
                    { subcourseId: subRefs[`${courseRefs.BCOM}_General`], code: 'CO302', name: 'Taxation' },

                    // B.Sc Computer Science
                    { subcourseId: subRefs[`${courseRefs.BSC}_Computer Science`], code: 'CS101', name: 'Programming in C' },
                    { subcourseId: subRefs[`${courseRefs.BSC}_Computer Science`], code: 'CS201', name: 'Data Structures' },
                    { subcourseId: subRefs[`${courseRefs.BSC}_Computer Science`], code: 'CS301', name: 'Database Management Systems' },
                    { subcourseId: subRefs[`${courseRefs.BSC}_Computer Science`], code: 'CS401', name: 'Operating Systems' },
                    { subcourseId: subRefs[`${courseRefs.BSC}_Computer Science`], code: 'CS402', name: 'Real Analysis' },

                    // B.Sc Data Science
                    { subcourseId: subRefs[`${courseRefs.BSC}_Data Science`], code: 'DS101', name: 'Introduction to Data Science' },
                    { subcourseId: subRefs[`${courseRefs.BSC}_Data Science`], code: 'DS201', name: 'Machine Learning Fundamentals' },
                    { subcourseId: subRefs[`${courseRefs.BSC}_Data Science`], code: 'DS301', name: 'Deep Learning' },
                    { subcourseId: subRefs[`${courseRefs.BSC}_Data Science`], code: 'DS401', name: 'Big Data Analytics' },

                    // BCA General
                    { subcourseId: subRefs[`${courseRefs.BCA}_General`], code: 'CA101', name: 'Programming in C' },
                    { subcourseId: subRefs[`${courseRefs.BCA}_General`], code: 'CA102', name: 'Digital Computer Fundamentals' },
                    { subcourseId: subRefs[`${courseRefs.BCA}_General`], code: 'CA201', name: 'Data Structures' },
                    { subcourseId: subRefs[`${courseRefs.BCA}_General`], code: 'CA202', name: 'Database Management Systems' },
                    { subcourseId: subRefs[`${courseRefs.BCA}_General`], code: 'CA301', name: 'Operating Systems' },
                    { subcourseId: subRefs[`${courseRefs.BCA}_General`], code: 'CA302', name: 'Computer Networks' },
                    { subcourseId: subRefs[`${courseRefs.BCA}_General`], code: 'CA401', name: 'Web Technologies' },
                    { subcourseId: subRefs[`${courseRefs.BCA}_General`], code: 'CA402', name: 'Software Engineering' },

                    // BBA General
                    { subcourseId: subRefs[`${courseRefs.BBA}_General`], code: 'BB101', name: 'Principles of Management' },
                    { subcourseId: subRefs[`${courseRefs.BBA}_General`], code: 'BB201', name: 'Organisational Behaviour' },
                    { subcourseId: subRefs[`${courseRefs.BBA}_General`], code: 'BB301', name: 'Business Environment' }
                ];
                for (const s of subjects) {
                    const ref = doc(collection(db, 'subjects'));
                    batch.set(ref, s);
                    log(`Subject: ${s.code} - ${s.name} (Subcourse: ${s.subcourseId})`);
                }

                // 4. Academic Years
                const years = [
                    { name: '2023-2024' },
                    { name: '2024-2025' },
                    { name: '2025-2026' }
                ];
                for (const y of years) {
                    const ref = doc(collection(db, 'academic_years'));
                    batch.set(ref, y);
                    log(`Year: ${y.name} (ID: ${ref.id})`);
                }

                await batch.commit();
                log('✅ Seed completed successfully!', 'success');
                alert('Seed completed! Check Firestore console. You can now delete seed-data.html');
            } catch (err) {
                log(`❌ Error: ${err.message}`, 'error');
                console.error(err);
            } finally {
                document.getElementById('seedBtn').disabled = false;
            }
        }

        async function clearData() {
            if (!confirm('Delete ALL data from courses, subcourses, subjects, academic_years?')) return;
            log('Clearing data...', 'info');
            try {
                const collections = ['courses', 'subcourses', 'subjects', 'academic_years'];
                for (const colName of collections) {
                    const snap = await getDocs(collection(db, colName));
                    const batch = writeBatch(db);
                    snap.docs.forEach(d => batch.delete(d.ref));
                    await batch.commit();
                    log(`Cleared ${colName} (${snap.size} docs)`);
                }
                log('✅ All data cleared', 'success');
            } catch (err) {
                log(`❌ Error: ${err.message}`, 'error');
            }
        }

        async function verifyData() {
            log('Verifying data...', 'info');
            try {
                const collections = ['courses', 'subcourses', 'subjects', 'academic_years'];
                for (const colName of collections) {
                    const snap = await getDocs(query(collection(db, colName), orderBy('name')));
                    log(`${colName}: ${snap.size} documents`);
                    snap.docs.forEach(d => {
                        const data = d.data();
                        log(`  - ${data.code || data.name} (${d.id})`);
                    });
                }
                log('✅ Verification complete', 'success');
            } catch (err) {
                log(`❌ Error: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
